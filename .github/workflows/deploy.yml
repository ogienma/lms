name: Build and push

on:
  push:
    branches: [production]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Set metadata
        id: meta
        run: echo "sha=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - name: Checkout frappe_docker (build tooling)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main

      - name: Build apps.json (payments + this exact commit of lms)
        run: |
          cat > apps.json <<EOF
          [
            {"url": "https://github.com/frappe/payments", "branch": "develop"},
            {"url": "https://github.com/ogienma/lms", "branch": "${{ github.sha }}"}
          ]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/custom/Containerfile
          platforms: linux/amd64
          push: true
          secret-files: |
            apps_json=apps.json
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=version-16
          tags: |
            ghcr.io/ogienma/lms:production
            ghcr.io/ogienma/lms:${{ steps.meta.outputs.sha }}

      - name: Verify apps actually made it into the image
        run: |
          docker run --rm ghcr.io/ogienma/lms:${{ steps.meta.outputs.sha }} cat sites/apps.txt
          docker run --rm ghcr.io/ogienma/lms:${{ steps.meta.outputs.sha }} cat sites/apps.txt | grep -qx payments
          docker run --rm ghcr.io/ogienma/lms:${{ steps.meta.outputs.sha }} cat sites/apps.txt | grep -qx lms
