name: Build and push

on:
  push:
    branches: [production]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

# One build per branch at a time; a newer push cancels an older in-flight run.
# Correctness doesn't depend on this (promote re-checks the branch head), it just saves runner time.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/ogienma/lms
  # Frappe 17 has no release tag yet, and bench can only clone frappe by branch or tag (not a commit),
  # so this follows develop. The commit that actually went in is resolved below and recorded as an
  # image label, like payments. Once v17 is tagged, pin that tag here and drop the moving ref.
  FRAPPE_REF: develop
  # Build tooling pinned to a commit so rebuilding the same lms commit uses the same Containerfile.
  FRAPPE_DOCKER_REF: 654c067add9d39191ac174d75525bc537c7602ce
  # bench can only clone payments by branch (and strips .git), so it can't be pinned to a commit.
  # The commit that actually went in is recorded as an image label instead.
  PAYMENTS_BRANCH: develop

jobs:
  # Resolve moving refs once so both architectures build from the same inputs.
  resolve:
    runs-on: ubuntu-latest
    outputs:
      payments_sha: ${{ steps.refs.outputs.payments_sha }}
      frappe_sha: ${{ steps.refs.outputs.frappe_sha }}
    steps:
      # bench clones lms by branch name, not by commit, so the image only contains github.sha
      # if nothing was pushed since this run was triggered.
      - name: Check the branch head is still this commit
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" "refs/heads/$GITHUB_REF_NAME" | cut -f1)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::error::$GITHUB_REF_NAME is at $head, not $GITHUB_SHA; a newer push supersedes this run."
            exit 1
          fi

      - name: Resolve payments commit
        id: refs
        run: |
          sha=$(git ls-remote https://github.com/frappe/payments "refs/heads/$PAYMENTS_BRANCH" | cut -f1)
          test -n "$sha"
          echo "payments_sha=$sha" >> "$GITHUB_OUTPUT"
          fsha=$(git ls-remote https://github.com/frappe/frappe "refs/heads/$FRAPPE_REF" | cut -f1)
          test -n "$fsha"
          echo "frappe_sha=$fsha" >> "$GITHUB_OUTPUT"

  # Each architecture builds natively on its own runner and pushes by digest (no tag yet).
  build:
    needs: resolve
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout frappe_docker (build tooling)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: ${{ env.FRAPPE_DOCKER_REF }}

      - name: Build apps.json (payments + lms)
        run: |
          cat > apps.json <<EOF
          [
            {"url": "https://github.com/frappe/payments", "branch": "${{ env.PAYMENTS_BRANCH }}"},
            {"url": "https://github.com/ogienma/lms", "branch": "${{ github.ref_name }}"}
          ]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/custom/Containerfile
          platforms: ${{ matrix.platform }}
          secret-files: |
            apps_json=apps.json
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.github.ogienma.lms.frappe-ref=${{ env.FRAPPE_REF }}
            io.github.ogienma.lms.frappe-sha=${{ needs.resolve.outputs.frappe_sha }}
            io.github.ogienma.lms.payments-ref=${{ needs.resolve.outputs.payments_sha }}
            io.github.ogienma.lms.frappe-docker-ref=${{ env.FRAPPE_DOCKER_REF }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify apps, PDF tooling and labels on this architecture
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$REF" uname -m
          docker run --rm "$REF" cat sites/apps.txt
          docker run --rm "$REF" cat sites/apps.txt | grep -qx payments
          docker run --rm "$REF" cat sites/apps.txt | grep -qx lms
          # lms develop requires Frappe 17; fail here rather than on the box.
          docker run --rm "$REF" bench version | tee /dev/stderr | grep -qE '^frappe 17\.'
          docker run --rm "$REF" test -x /usr/bin/chromium-headless-shell
          docker run --rm "$REF" wkhtmltopdf --version
          rev=$(docker image inspect "$REF" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')
          test "$rev" = "$GITHUB_SHA"

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest under the commit tags only.
  # :production is not touched here.
  merge:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.digest.outputs.digest }}
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --annotation "index:org.opencontainers.image.revision=$GITHUB_SHA" \
            --annotation "index:io.github.ogienma.lms.frappe-ref=$FRAPPE_REF" \
            -t "$IMAGE:$GITHUB_SHA" \
            -t "$IMAGE:${GITHUB_SHA::12}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Verify both architectures are in the manifest
        run: |
          docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA"
          archs=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform.architecture')
          echo "$archs" | grep -qx amd64
          echo "$archs" | grep -qx arm64

      - name: Record manifest digest
        id: digest
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
          echo "$digest" | grep -qE '^sha256:[0-9a-f]{64}$'
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

  # Move :production to the verified manifest. The VM follows :production, so this is the deploy.
  promote:
    needs: merge
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      # A newer push may have landed during the build. Its own run will promote; this one must not
      # overwrite it with an older image.
      - name: Check the branch head is still this commit
        id: head
        run: |
          head=$(git ls-remote "https://github.com/$GITHUB_REPOSITORY" refs/heads/production | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::production moved to $head during this build; skipping promotion of $GITHUB_SHA."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.head.outputs.current == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.head.outputs.current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag :production
        if: steps.head.outputs.current == 'true'
        env:
          DIGEST: ${{ needs.merge.outputs.digest }}
        run: |
          docker buildx imagetools create -t "$IMAGE:production" "$IMAGE@$DIGEST"
          moved=$(docker buildx imagetools inspect "$IMAGE:production" --format '{{json .Manifest}}' | jq -r .digest)
          echo ":production -> $moved"
          test "$moved" = "$DIGEST"
