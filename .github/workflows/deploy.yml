name: Build and push

on:
  push:
    branches: [production]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/ogienma/lms
  # Pinned on purpose: framework upgrades get their own PR instead of riding along with other changes.
  FRAPPE_REF: v16.34.0

jobs:
  # Each architecture builds natively on its own runner and pushes by digest (no tag yet).
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout frappe_docker (build tooling)
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main

      - name: Build apps.json (payments + lms)
        run: |
          cat > apps.json <<EOF
          [
            {"url": "https://github.com/frappe/payments", "branch": "develop"},
            {"url": "https://github.com/ogienma/lms", "branch": "${{ github.ref_name }}"}
          ]
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/custom/Containerfile
          platforms: ${{ matrix.platform }}
          secret-files: |
            apps_json=apps.json
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_REF }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Verify apps and PDF tooling on this architecture
        env:
          REF: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm "$REF" uname -m
          docker run --rm "$REF" cat sites/apps.txt
          docker run --rm "$REF" cat sites/apps.txt | grep -qx payments
          docker run --rm "$REF" cat sites/apps.txt | grep -qx lms
          docker run --rm "$REF" test -x /usr/bin/chromium-headless-shell
          docker run --rm "$REF" wkhtmltopdf --version

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Stitch the per-arch digests into one multi-arch manifest and tag it.
  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            -t "$IMAGE:production" \
            -t "$IMAGE:${GITHUB_SHA::12}" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Verify both architectures are in the manifest
        run: |
          docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA::12}"
          archs=$(docker buildx imagetools inspect "$IMAGE:${GITHUB_SHA::12}" --format '{{json .Manifest}}' \
            | jq -r '.manifests[].platform.architecture')
          echo "$archs" | grep -qx amd64
          echo "$archs" | grep -qx arm64
